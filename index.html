<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spike Scanner — Binance Token Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #060a12;
    --card: rgba(255,255,255,.02);
    --border: rgba(255,255,255,.06);
    --gold: #f0b90b;
    --green: #22c55e;
    --red: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --dim: #475569;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a0e17; }
  ::-webkit-scrollbar-thumb { background: #1e2a3a; border-radius: 3px; }

  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes slide-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .wrap { max-width: 920px; margin: 0 auto; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .logo-row { display: flex; align-items: center; gap: 10px; }
  .logo-text { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: -0.5px; }
  .sub { font-size: 13px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .last-update { font-size: 12px; color: var(--muted); display: flex; align-items: center; font-family: var(--mono); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #64748b; }
  .dot.live { background: var(--green); animation: pulse-dot 2s infinite; }

  .btn {
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
    color: #94a3b8; padding: 6px 14px; border-radius: 6px; font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: var(--mono); transition: all .15s;
  }
  .btn:hover { background: rgba(255,255,255,.08); }
  .btn.active { background: rgba(34,197,94,.12); color: var(--green); border-color: rgba(34,197,94,.25); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Controls */
  .controls {
    display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
    padding: 14px 16px; background: var(--card); border-radius: 10px; border: 1px solid rgba(255,255,255,.05);
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 6px; }
  .ctrl-group.search { flex: 1; min-width: 140px; }
  .ctrl-label { font-size: 10px; font-weight: 600; color: var(--dim); letter-spacing: .5px; font-family: var(--mono); }
  .pills { display: flex; gap: 4px; flex-wrap: wrap; }
  .pill {
    padding: 4px 10px; font-size: 12px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,.06); background: transparent;
    color: var(--muted); cursor: pointer; font-family: var(--mono); font-weight: 500; transition: all .15s;
  }
  .pill:hover { border-color: rgba(255,255,255,.15); }
  .pill.on { background: rgba(240,185,11,.12); color: var(--gold); border-color: rgba(240,185,11,.3); }
  .search-input {
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
    color: var(--text); padding: 5px 10px; border-radius: 5px; font-size: 13px;
    outline: none; font-family: var(--mono); width: 100%;
  }
  .search-input:focus { border-color: rgba(240,185,11,.3); }

  /* Stats */
  .stats { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 70px; padding: 10px 12px;
    background: var(--card); border-radius: 8px; border: 1px solid rgba(255,255,255,.04);
  }
  .stat-val { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--gold); display: block; }
  .stat-val.g { color: var(--green); }
  .stat-val.r { color: var(--red); }
  .stat-val.sm { font-size: 14px; }
  .stat-label { font-size: 11px; color: var(--dim); font-weight: 500; display: block; margin-top: 2px; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 8px 16px; font-size: 13px; font-weight: 600;
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); cursor: pointer; font-family: var(--sans);
  }
  .tab:hover { color: #94a3b8; }
  .tab.on { color: var(--gold); border-bottom-color: var(--gold); }

  /* Error */
  .error {
    background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2);
    color: var(--red); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
  }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

  .card {
    padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border);
    animation: slide-in .3s ease both;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .token-name { font-family: var(--mono); font-size: 16px; font-weight: 700; color: #f1f5f9; }
  .token-q { font-size: 12px; color: var(--dim); font-weight: 500; }
  .badge {
    padding: 3px 8px; border-radius: 5px; font-size: 13px;
    font-weight: 700; font-family: var(--mono);
  }
  .badge.up { background: rgba(34,197,94,.15); color: var(--green); }
  .badge.dn { background: rgba(239,68,68,.15); color: var(--red); }

  .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .price { font-family: var(--mono); font-size: 15px; font-weight: 600; color: #cbd5e1; }

  .meta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .meta-label { font-size: 10px; color: var(--dim); font-family: var(--mono); display: block; }
  .meta-val { font-size: 12px; color: #94a3b8; font-family: var(--mono); font-weight: 500; display: block; }

  .bar-bg { height: 3px; background: rgba(255,255,255,.04); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; transition: width .5s ease; }

  .empty { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--dim); font-size: 14px; }
  .empty small { font-size: 13px; opacity: .5; }

  /* History */
  .history { display: flex; flex-direction: column; gap: 8px; }
  .h-item {
    padding: 12px 16px; border-radius: 8px;
    background: var(--card); border: 1px solid rgba(255,255,255,.05);
  }
  .h-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .h-time { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .h-count { font-size: 12px; color: var(--gold); font-weight: 600; font-family: var(--mono); }
  .h-tokens { display: flex; gap: 10px; flex-wrap: wrap; }
  .h-tok { font-size: 12px; font-family: var(--mono); font-weight: 600; }
  .h-tok.up { color: var(--green); }
  .h-tok.dn { color: var(--red); }

  .footer {
    margin-top: 24px; text-align: center; font-size: 12px;
    color: #334155; line-height: 1.6; font-family: var(--mono);
  }

  /* Schedule banner */
  .schedule-banner {
    background: rgba(240,185,11,.06); border: 1px solid rgba(240,185,11,.15);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .schedule-icon { font-size: 22px; }
  .schedule-text { font-size: 13px; color: #94a3b8; font-family: var(--mono); flex: 1; min-width: 200px; }
  .schedule-text strong { color: var(--gold); }
  .countdown { font-family: var(--mono); font-size: 13px; color: var(--gold); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap" id="app">

  <!-- Header -->
  <div class="header">
    <div>
      <div class="logo-row">
        <svg width="28" height="28" viewBox="0 0 28 28">
          <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" fill="none" stroke="#f0b90b" stroke-width="1.5"/>
          <polygon points="14,7 20,10.5 20,17.5 14,21 8,17.5 8,10.5" fill="#f0b90b" opacity=".15"/>
          <polygon points="14,10 17,11.75 17,15.25 14,17 11,15.25 11,11.75" fill="#f0b90b"/>
        </svg>
        <span class="logo-text">Spike Scanner</span>
      </div>
      <div class="sub" id="subline">Binance · USDT pairs · ≥5% moves</div>
    </div>
    <div class="header-right">
      <span class="last-update" id="lastUpdate"></span>
      <button class="btn" id="btnAuto" onclick="toggleAuto()">Auto</button>
      <button class="btn" id="btnScan" onclick="scan()">Scan</button>
    </div>
  </div>

  <!-- Schedule Banner -->
  <div class="schedule-banner">
    <span class="schedule-icon">⏰</span>
    <span class="schedule-text">Daily scan scheduled at <strong>5:30 AM</strong>. Leave this tab open for auto-trigger.</span>
    <span class="countdown" id="countdown"></span>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">Quote</span>
      <div class="pills" id="quotePills"></div>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Spike ≥</span>
      <div class="pills" id="threshPills"></div>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Sort</span>
      <div class="pills" id="sortPills"></div>
    </div>
    <div class="ctrl-group search">
      <span class="ctrl-label">Search</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Token name…" oninput="render()">
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="statsBar"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab on" id="tabSpikes" onclick="switchView('spikes')">Live Spikes</button>
    <button class="tab" id="tabHistory" onclick="switchView('history')">Scan History</button>
  </div>

  <!-- Error -->
  <div class="error" id="errorBox" style="display:none"></div>

  <!-- Content -->
  <div id="content"></div>

  <div class="footer">Open daily at 5:30 AM to catch overnight spikes · Auto-scan triggers if tab is open · Data from Binance public API</div>
</div>

<script>
// ─── State ───
var state = {
  tokens: [],
  quote: 'USDT',
  threshold: 5,
  sortBy: 'change',
  autoRefresh: false,
  loading: false,
  lastFetch: null,
  history: JSON.parse(localStorage.getItem('spike_history') || '[]'),
  view: 'spikes',
  klines: {},
  scheduleFired: false
};

var autoInterval = null;
var QUOTES = ['USDT','BUSD','BTC','ETH','BNB'];
var THRESHOLDS = [3,5,10,15,20,30,50];
var SORTS = [['change','% Change'],['volume','Volume'],['price','Price']];

// ─── Helpers ───
function fmtNum(n, d) {
  d = d === undefined ? 2 : d;
  if (n === null || n === undefined || isNaN(n)) return '—';
  if (Math.abs(n) >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1)+'K';
  return Number(n).toFixed(d);
}

function fmtPrice(p) {
  var n = Number(p);
  if (isNaN(n)) return '—';
  if (n < 0.0001) return n.toFixed(8);
  if (n < 0.01) return n.toFixed(6);
  if (n < 1) return n.toFixed(4);
  if (n < 100) return n.toFixed(3);
  return n.toFixed(2);
}

function timeAgo(ts) {
  if (!ts) return '';
  var diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  return Math.floor(diff/3600) + 'h ago';
}

function sparkSVG(data, color, w, h) {
  w = w || 80; h = h || 28;
  if (!data || data.length < 2) return '';
  var min = Math.min.apply(null, data);
  var max = Math.max.apply(null, data);
  var range = max - min || 1;
  var step = w / (data.length - 1);
  var pts = [];
  for (var i = 0; i < data.length; i++) {
    pts.push((i * step) + ',' + (h - ((data[i] - min) / range) * (h - 4) - 2));
  }
  return '<svg width="'+w+'" height="'+h+'" style="display:block"><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

// ─── Pills ───
function buildPills() {
  var qh = '';
  QUOTES.forEach(function(q) {
    qh += '<button class="pill'+(state.quote===q?' on':'')+'" onclick="setQuote(\''+q+'\')">'+q+'</button>';
  });
  document.getElementById('quotePills').innerHTML = qh;

  var th = '';
  THRESHOLDS.forEach(function(t) {
    th += '<button class="pill'+(state.threshold===t?' on':'')+'" onclick="setThreshold('+t+')">'+t+'%</button>';
  });
  document.getElementById('threshPills').innerHTML = th;

  var sh = '';
  SORTS.forEach(function(s) {
    sh += '<button class="pill'+(state.sortBy===s[0]?' on':'')+'" onclick="setSort(\''+s[0]+'\')">'+s[1]+'</button>';
  });
  document.getElementById('sortPills').innerHTML = sh;

  document.getElementById('subline').textContent = 'Binance · '+state.quote+' pairs · ≥'+state.threshold+'% moves';
}

function setQuote(q) { state.quote = q; buildPills(); scan(); }
function setThreshold(t) { state.threshold = t; buildPills(); render(); }
function setSort(s) { state.sortBy = s; buildPills(); render(); }

function toggleAuto() {
  state.autoRefresh = !state.autoRefresh;
  var btn = document.getElementById('btnAuto');
  if (state.autoRefresh) {
    btn.classList.add('active');
    btn.textContent = 'Live';
    autoInterval = setInterval(scan, 30000);
  } else {
    btn.classList.remove('active');
    btn.textContent = 'Auto';
    clearInterval(autoInterval);
  }
  updateLastFetch();
}

function switchView(v) {
  state.view = v;
  document.getElementById('tabSpikes').className = 'tab' + (v==='spikes'?' on':'');
  document.getElementById('tabHistory').className = 'tab' + (v==='history'?' on':'');
  document.getElementById('tabHistory').textContent = 'Scan History (' + state.history.length + ')';
  render();
}

function updateLastFetch() {
  var el = document.getElementById('lastUpdate');
  if (!state.lastFetch) { el.innerHTML = ''; return; }
  var dotClass = state.autoRefresh ? 'dot live' : 'dot';
  el.innerHTML = '<span class="'+dotClass+'"></span>' + timeAgo(state.lastFetch);
}

// ─── Fetch ───
function scan() {
  if (state.loading) return;
  state.loading = true;
  document.getElementById('btnScan').textContent = '…';
  document.getElementById('btnScan').disabled = true;
  document.getElementById('errorBox').style.display = 'none';

  fetch('https://api.binance.com/api/v3/ticker/24hr')
    .then(function(r) {
      if (!r.ok) throw new Error('API error ' + r.status);
      return r.json();
    })
    .then(function(data) {
      var now = Date.now();
      var filtered = [];
      data.forEach(function(t) {
        if (!t.symbol.endsWith(state.quote)) return;
        var vol = Number(t.quoteVolume);
        var price = Number(t.lastPrice);
        if (vol <= 0 || price <= 0) return;
        filtered.push({
          symbol: t.symbol,
          base: t.symbol.replace(state.quote, ''),
          price: price,
          change: Number(t.priceChangePercent),
          high: Number(t.highPrice),
          low: Number(t.lowPrice),
          volume: vol,
          trades: Number(t.count),
          openPrice: Number(t.openPrice)
        });
      });

      state.tokens = filtered;
      state.lastFetch = now;

      // Log spikes
      var spikes = filtered.filter(function(t) { return Math.abs(t.change) >= state.threshold; });
      if (spikes.length > 0) {
        spikes.sort(function(a,b) { return Math.abs(b.change) - Math.abs(a.change); });
        var entry = {
          time: now,
          count: spikes.length,
          threshold: state.threshold,
          quote: state.quote,
          top: spikes.slice(0, 5).map(function(s) {
            return { symbol: s.base, change: s.change, price: s.price };
          })
        };
        state.history.unshift(entry);
        if (state.history.length > 100) state.history = state.history.slice(0, 100);
        try { localStorage.setItem('spike_history', JSON.stringify(state.history)); } catch(e) {}
      }

      // Fetch sparklines for top 6
      var topSyms = spikes.slice(0, 6).map(function(s) { return s.symbol; });
      state.klines = {};
      var promises = topSyms.map(function(sym) {
        return fetch('https://api.binance.com/api/v3/klines?symbol='+sym+'&interval=1h&limit=24')
          .then(function(r) { return r.json(); })
          .then(function(kd) {
            state.klines[sym] = kd.map(function(k) { return Number(k[4]); });
          })
          .catch(function() {});
      });

      Promise.all(promises).then(function() {
        render();
        updateLastFetch();
      });
    })
    .catch(function(e) {
      document.getElementById('errorBox').textContent = e.message + ' — check your internet connection or try again.';
      document.getElementById('errorBox').style.display = 'block';
    })
    .finally(function() {
      state.loading = false;
      document.getElementById('btnScan').textContent = 'Scan';
      document.getElementById('btnScan').disabled = false;
    });
}

// ─── Render ───
function render() {
  updateLastFetch();

  var search = (document.getElementById('searchInput').value || '').toLowerCase();
  var threshold = state.threshold;
  var tokens = state.tokens;

  // Stats
  var allSpikes = tokens.filter(function(t) { return Math.abs(t.change) >= threshold; });
  var gainers = tokens.filter(function(t) { return t.change >= threshold; });
  var losers = tokens.filter(function(t) { return t.change <= -threshold; });
  var bg = null, bl = null;
  tokens.forEach(function(t) {
    if (!bg || t.change > bg.change) bg = t;
    if (!bl || t.change < bl.change) bl = t;
  });

  var sh = '';
  sh += '<div class="stat"><span class="stat-val">'+allSpikes.length+'</span><span class="stat-label">Spikes</span></div>';
  sh += '<div class="stat"><span class="stat-val g">'+gainers.length+'</span><span class="stat-label">Pumps</span></div>';
  sh += '<div class="stat"><span class="stat-val r">'+losers.length+'</span><span class="stat-label">Dumps</span></div>';
  sh += '<div class="stat" style="flex:2"><span class="stat-val g sm">'+(bg ? bg.base+' +'+bg.change.toFixed(1)+'%' : '—')+'</span><span class="stat-label">Top Gainer</span></div>';
  sh += '<div class="stat" style="flex:2"><span class="stat-val r sm">'+(bl ? bl.base+' '+bl.change.toFixed(1)+'%' : '—')+'</span><span class="stat-label">Top Loser</span></div>';
  sh += '<div class="stat"><span class="stat-val">'+tokens.length+'</span><span class="stat-label">Total Pairs</span></div>';
  document.getElementById('statsBar').innerHTML = sh;

  document.getElementById('tabHistory').textContent = 'Scan History (' + state.history.length + ')';

  var content = document.getElementById('content');

  if (state.view === 'history') {
    renderHistory(content);
    return;
  }

  // Filter & sort
  var visible = allSpikes.filter(function(t) {
    return search ? t.base.toLowerCase().indexOf(search) !== -1 : true;
  });

  if (state.sortBy === 'change') visible.sort(function(a,b) { return Math.abs(b.change)-Math.abs(a.change); });
  else if (state.sortBy === 'volume') visible.sort(function(a,b) { return b.volume-a.volume; });
  else if (state.sortBy === 'price') visible.sort(function(a,b) { return b.price-a.price; });

  if (visible.length === 0 && !state.loading) {
    content.innerHTML = '<div class="grid"><div class="empty">No tokens with ≥'+threshold+'% movement right now.<br><small>Try lowering the threshold or switching quote currency.</small></div></div>';
    return;
  }

  var html = '<div class="grid">';
  visible.forEach(function(t, i) {
    var up = t.change > 0;
    var accent = up ? '#22c55e' : '#ef4444';
    var bg = up ? 'rgba(34,197,94,.04)' : 'rgba(239,68,68,.04)';
    var intensity = Math.min(Math.abs(t.change) / 50, 1);
    var bc = up ? 'rgba(34,197,94,'+(0.1+intensity*0.3)+')' : 'rgba(239,68,68,'+(0.1+intensity*0.3)+')';
    var spark = state.klines[t.symbol] ? sparkSVG(state.klines[t.symbol], accent) : '';
    var arrow = up ? '▲' : '▼';
    var cls = up ? 'up' : 'dn';
    var barW = Math.min(Math.abs(t.change), 100);
    var grad = 'linear-gradient(90deg, '+accent+'33, '+accent+')';

    html += '<div class="card" style="background:'+bg+';border-color:'+bc+';animation-delay:'+(i*0.03)+'s">';
    html += '<div class="card-top">';
    html += '<div><span class="token-name">'+t.base+'</span><span class="token-q">/'+state.quote+'</span></div>';
    html += '<span class="badge '+cls+'">'+arrow+' '+Math.abs(t.change).toFixed(2)+'%</span>';
    html += '</div>';
    html += '<div class="price-row"><span class="price">$'+fmtPrice(t.price)+'</span>'+spark+'</div>';
    html += '<div class="meta-row">';
    html += '<div><span class="meta-label">Vol</span><span class="meta-val">$'+fmtNum(t.volume)+'</span></div>';
    html += '<div><span class="meta-label">Trades</span><span class="meta-val">'+fmtNum(t.trades,0)+'</span></div>';
    html += '<div><span class="meta-label">H/L</span><span class="meta-val">'+fmtPrice(t.high)+' / '+fmtPrice(t.low)+'</span></div>';
    html += '</div>';
    html += '<div class="bar-bg"><div class="bar-fill" style="width:'+barW+'%;background:'+grad+'"></div></div>';
    html += '</div>';
  });
  html += '</div>';
  content.innerHTML = html;
}

function renderHistory(el) {
  if (state.history.length === 0) {
    el.innerHTML = '<div class="history"><div class="empty">No scan history yet. Spikes are logged here after each scan.</div></div>';
    return;
  }
  var html = '<div class="history">';
  state.history.forEach(function(h) {
    html += '<div class="h-item">';
    html += '<div class="h-head">';
    html += '<span class="h-time">'+new Date(h.time).toLocaleTimeString()+' · '+new Date(h.time).toLocaleDateString()+'</span>';
    html += '<span class="h-count">'+h.count+' spikes (≥'+(h.threshold||state.threshold)+'%)</span>';
    html += '</div>';
    html += '<div class="h-tokens">';
    (h.top || []).forEach(function(t) {
      var cls = t.change > 0 ? 'up' : 'dn';
      var sign = t.change > 0 ? '+' : '';
      html += '<span class="h-tok '+cls+'">'+t.symbol+' '+sign+t.change.toFixed(1)+'%</span>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

// ─── 5:30 AM Scheduler ───
function updateCountdown() {
  var now = new Date();
  var target = new Date(now);
  target.setHours(5, 30, 0, 0);
  if (now >= target) {
    target.setDate(target.getDate() + 1);
  }
  var diff = target - now;
  var h = Math.floor(diff / 3600000);
  var m = Math.floor((diff % 3600000) / 60000);
  var s = Math.floor((diff % 60000) / 1000);
  document.getElementById('countdown').textContent =
    h + 'h ' + m + 'm ' + s + 's';

  // Auto-trigger at 5:30 AM
  var nowH = now.getHours();
  var nowM = now.getMinutes();
  if (nowH === 5 && nowM === 30 && !state.scheduleFired) {
    state.scheduleFired = true;
    scan();
    // Play notification sound if possible
    try {
      if (Notification.permission === 'granted') {
        new Notification('Spike Scanner', { body: 'Daily 5:30 AM scan triggered!', icon: '⏰' });
      }
    } catch(e) {}
  }
  if (nowH !== 5 || nowM !== 30) {
    state.scheduleFired = false;
  }
}

// ─── Notification permission ───
function requestNotif() {
  try {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  } catch(e) {}
}

// ─── Init ───
buildPills();
scan();
setInterval(updateCountdown, 1000);
setInterval(updateLastFetch, 5000);
updateCountdown();
requestNotif();
</script>
